name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'          # e.g. v1.0.0, v1.2.3
  workflow_dispatch:      # allows manual runs from the Actions tab

permissions:
  contents: write         # required so the workflow can create a release

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Match the project's TargetFramework (net10.0-windows...)
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SomaMetalTray.csproj

      - name: Publish (framework-dependent, single-file, win-x64)
        run: >
          dotnet publish SomaMetalTray.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:GenerateDocumentationFile=false
          -p:CopyDebugSymbolFilesFromPackages=false
          -p:CopyDocumentationFilesFromPackages=false
          -o publish

      - name: Clean publish folder
        shell: pwsh
        run: |
          Get-ChildItem publish -Include *.pdb,*.xml -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          Write-Host "Publish folder contents:"
          Get-ChildItem publish | Format-Table Name, Length

      - name: Zip published output
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }
          Compress-Archive -Path publish\* -DestinationPath "SomaMetalTray-$version-win-x64.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SomaMetalTray-*.zip
          generate_release_notes: true

      - name: Notify Death.FM Players site to rebuild
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true # don't fail the release if the deploy hook secret isn't set up yet
        run: curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
