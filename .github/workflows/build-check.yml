name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Match the project's TargetFramework (net10.0-windows...)
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SomaMetalTray.csproj

      - name: Build
        run: dotnet build SomaMetalTray.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/SomaMetalTray.Tests -c Release
